name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaizenai
          POSTGRES_PASSWORD: kaizenai
          POSTGRES_DB: kaizenai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kaizenai -d kaizenai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run PostgreSQL migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://kaizenai:kaizenai@127.0.0.1:5432/kaizenai_test
          AUTO_CREATE_SCHEMA: 'false'
          SECRET_KEY: ci-secret-key
        run: python scripts/migrate.py
      - name: Run backend tests on PostgreSQL and Redis
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://kaizenai:kaizenai@127.0.0.1:5432/kaizenai_test
          TEST_DATABASE_URL: postgresql+psycopg2://kaizenai:kaizenai@127.0.0.1:5432/kaizenai_test
          AUTO_CREATE_SCHEMA: 'false'
          SECRET_KEY: ci-secret-key
          KIE_API_KEY: mock_key
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
