services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kaizenai
      POSTGRES_PASSWORD: kaizenai
      POSTGRES_DB: kaizenai_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizenai -d kaizenai_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
